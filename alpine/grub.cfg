insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search_label
search --no-floppy --label AIKA_MINI --set=root
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
loadfont /boot/grub/fonts/unicode.pf2
loadfont /boot/grub/themes/aikaos/aika24.pf2
loadfont /boot/grub/themes/aikaos/aika18.pf2
set gfxmode=1920x1080,1280x720,1024x768,auto
set gfxpayload=keep
terminal_output gfxterm
set theme=/boot/grub/themes/aikaos/theme.txt
export theme
set timeout=8
menuentry "AikaOS Mini starten" --id aikaos {
linux /boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage console=ttyS0,115200 console=tty0 quiet
initrd /boot/amd-ucode.img /boot/intel-ucode.img /boot/initramfs-lts
}
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI-Einstellungen" { fwsetup }
fi
menuentry "Neustarten" { reboot }
menuentry "Ausschalten" { halt }
